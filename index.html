<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MANNA Trading</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>MANNA Deriv Trading App</header>
<div class="logo">WELCOME TO RAE- MANNA</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('trade')">Trade</div>
  <div class="tab" onclick="switchTab('copy')">Copy Trading</div>
  <div class="tab" onclick="switchTab('history')">Trade History</div>
</div>

<div class="tab-content active" id="tab_trade">
  <div class="section">
    <button onclick="loginWithDeriv()">Login with Deriv</button>
    <div id="user_info"></div>

    <h3>Trade Options</h3>
    <label>Symbol</label>
    <select id="symbol_select">
      <option value="R_100">R_100</option>
      <option value="R_75">R_75</option>
      <option value="R_50">R_50</option>
    </select>

    <label>Contract Type</label>
    <select id="contract_type">
      <option value="CALL">Rise</option>
      <option value="PUT">Fall</option>
      <option value="EVEN">Even</option>
      <option value="ODD">Odd</option>
      <option value="OVER">Over</option>
      <option value="UNDER">Under</option>
      <option value="DIFFER">Differs</option>
      <option value="MATCH">Matches</option>
    </select>

    <label>Stake</label>
    <input type="number" id="stake" value="1" min="0.35" />

    <label>Duration</label>
    <input type="number" id="duration" value="1" min="1" />
    <select id="duration_unit">
      <option value="t">Ticks</option>
      <option value="s">Seconds</option>
      <option value="m">Minutes</option>
    </select>

    <button onclick="placeContract()">Purchase Contract</button>

    <h4>Live Quote: <span id="quote_display">--</span></h4>
  </div>
</div>

<div class="tab-content" id="tab_copy">
  <div class="section">
    <h3>Copy Trading</h3>
    <input type="text" id="master_token" placeholder="Enter Master Token" />
    <button onclick="startCopyTrading()">Start Copying</button>
  </div>
</div>

<div class="tab-content" id="tab_history">
  <div class="section">
    <h3>Trade History (Session)</h3>
    <ul id="trade_log"></ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
